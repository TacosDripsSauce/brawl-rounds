name: sheets-static-check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/preflight.py
      - run: python tools/generate.py
      - run: git diff --exit-code
      - run: python tools/static_check.py
